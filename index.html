<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Landio Limo Services LLC</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0d10;
      color: #e8e8e8;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 520px; }
    h1 { font-size: 1.9rem; letter-spacing: 0.04em; font-weight: 600; }
    .tag { color: #9aa0a6; margin-top: 0.5rem; font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .line { width: 48px; height: 2px; background: #c9a24b; margin: 1.5rem auto; }
    p { color: #b7bcc2; line-height: 1.6; }
    a { color: #c9a24b; text-decoration: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Landio Limo Services</h1>
    <div class="tag">Washington, DC &middot; Maryland &middot; Virginia</div>
    <div class="line"></div>
    <p>Our new site is on the way.<br />For reservations, call <a href="tel:+12405957025">(240) 595-7025</a> or email <a href="mailto:info@landiolimo.com">info@landiolimo.com</a>.</p>
  </main>
</body>
</html>
